<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/cohort-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cohort PCCOE</title>
    <meta name="description" content="Cohort PCCOE is the official social platform for PCCOE students to discover communities, connect with peers, collaborate, and stay updated on campus opportunities." />

    <!-- Google Fonts: Inter Tight & Urbanist -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Instant Pre-Hydration Theme Initializer (Zero Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cohort-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
